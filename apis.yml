aid: firehawk-aerospace
name: Firehawk Aerospace
description: 'Firehawk Aerospace, Inc. is a Dallas, Texas defense-technology manufacturer
  founded in 2019 by Ronald Jones, Will Edwards and Steve Edwards that replaces conventional
  rocket-propulsion production with additive manufacturing. Its proprietary 3D-printed
  solid rocket fuel, branded 3D-Ultra, is used to build hybrid rocket engines and solid
  rocket motors whose fuel-grain geometry is printed rather than cast, cutting production
  timelines from years to weeks while removing the handling hazards of traditional
  energetics. The company works under U.S. Army Applications Laboratory SBIR Phase III
  and U.S. Air Force Test Center contracts, has flight-tested an additively manufactured
  GMLRS-class analog, and is expanding manufacturing capacity in Lawton, Oklahoma and
  Crawford, Mississippi. Firehawk now operates publicly as Firehawk Defense
  (firehawkdefense.com); the firehawkaerospace.com domain 301-redirects there. It is a
  hardware and energetics manufacturer, not a software vendor: it publishes no developer
  portal, no API documentation, no SDK and no machine-readable API contract.'
